name: Publish FPL dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Fridays at 08:17 Singapore time. Scheduled runs may be delayed by GitHub.
    - cron: "17 0 * * 5"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: Run regression tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Download FPL data and build snapshot
        run: uv run --no-sync python build_site.py --refresh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
